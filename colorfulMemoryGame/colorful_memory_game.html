<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A colorful memory card matching game.">
    <title>Colorful Memory Game</title>

    <link rel="stylesheet" href="colorfulGame.css">
    <script src="colorful_memory_game.js" defer></script>
</head>

<body>
    <main class="game">
        <header class="game-header">
            <h1>Colorful Memory Game</h1>
            <p>Find all matching color pairs!</p>
        </header>

        <section class="game-panel" aria-label="Game information">
            <div class="game-info">
                <p>Score: <span id="score">0</span></p>
                <p>Time: <span id="timer">30</span>s</p>
            </div>

            <div
                id="game-container"
                class="game-container"
                aria-label="Memory game cards"
            ></div>

            <button id="start-button" type="button">
                Start Game
            </button>

            <p
                id="game-status"
                class="game-status"
                aria-live="polite"
            ></p>
        </section>
    </main>
</body>
</html>
